<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="vratArticleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#vratArticleBg)"/>
  
  <!-- Mandala / Rangoli decorative background pattern -->
  <g stroke="#fed7aa" stroke-width="1.5" fill="none" opacity="0.25">
    <circle cx="400" cy="225" r="160"/>
    <circle cx="400" cy="225" r="120"/>
    <circle cx="400" cy="225" r="80"/>
    <circle cx="400" cy="225" r="40"/>
    <path d="M 400 45 L 400 405 M 220 225 L 580 225 M 273 98 L 527 352 M 273 352 L 527 98"/>
  </g>

  <!-- Glowing Center Diya with Flame -->
  <g transform="translate(400, 200)">
    <!-- Diya Glow -->
    <circle cx="0" cy="0" r="70" fill="#fef08a" opacity="0.3"/>
    <circle cx="0" cy="0" r="40" fill="#fef08a" opacity="0.6"/>
    
    <!-- Flame -->
    <path d="M 0 -70 C 25 -35 20 -10 0 0 C -20 -10 -25 -35 0 -70 Z" fill="#fbbf24"/>
    <path d="M 0 -55 C 14 -25 10 -8 0 0 C -10 -8 -14 -25 0 -55 Z" fill="#fef08a"/>

    <!-- Brass Diya Bowl -->
    <path d="M -70 10 C -70 55 70 55 70 10 C 35 20 -35 20 -70 10 Z" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
    <rect x="-18" y="52" width="36" height="12" rx="4" fill="#d97706"/>
    <line x1="-35" y1="64" x2="35" y2="64" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Floating Calendar Badge -->
  <g transform="translate(140, 140)">
    <rect width="160" height="170" rx="16" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.3))"/>
    <rect width="160" height="45" rx="16" fill="#dc2626"/>
    <text x="80" y="30" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">VRAT 2025</text>
    <text x="80" y="95" font-family="-apple-system, sans-serif" font-size="38" font-weight="800" fill="#1e293b" text-anchor="middle">15</text>
    <text x="80" y="125" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#ea580c" text-anchor="middle">Ekadashi</text>
    <text x="80" y="148" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fasting Timings</text>
  </g>

  <!-- Star / Sparks -->
  <circle cx="580" cy="120" r="3" fill="#fef08a"/>
  <circle cx="640" cy="180" r="4" fill="#fef08a"/>
  <circle cx="560" cy="280" r="3" fill="#fef08a"/>
  <circle cx="240" cy="90" r="3" fill="#fef08a"/>
</svg>
