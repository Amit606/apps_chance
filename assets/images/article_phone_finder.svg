<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3525"/>
      <stop offset="40%" stop-color="#3d2a1c"/>
      <stop offset="70%" stop-color="#2c1d13"/>
      <stop offset="100%" stop-color="#1f140c"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e39"/>
      <stop offset="50%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#0c0d11"/>
    </linearGradient>
    <linearGradient id="phoneScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e30"/>
      <stop offset="100%" stop-color="#243b55"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="phoneShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="15" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Wooden Desk Background -->
  <rect width="800" height="450" fill="url(#deskGrad)" />
  
  <!-- Desk wood grain lines -->
  <path d="M0 80 Q 400 95 800 70" stroke="#5c4230" stroke-width="1.5" opacity="0.3" fill="none"/>
  <path d="M0 160 Q 400 175 800 150" stroke="#5c4230" stroke-width="1.5" opacity="0.25" fill="none"/>
  <path d="M0 240 Q 400 255 800 230" stroke="#5c4230" stroke-width="2" opacity="0.3" fill="none"/>
  <path d="M0 330 Q 400 345 800 310" stroke="#5c4230" stroke-width="1.5" opacity="0.25" fill="none"/>
  <path d="M0 400 Q 400 410 800 390" stroke="#5c4230" stroke-width="1.5" opacity="0.3" fill="none"/>

  <!-- Phone Graphic Group (Isometric / Angled) -->
  <g transform="translate(180, 70) rotate(-16)" filter="url(#phoneShadow)">
    <!-- Phone Chassis Outer -->
    <rect x="0" y="0" width="190" height="340" rx="32" fill="url(#phoneBody)" stroke="#475569" stroke-width="3"/>
    
    <!-- Phone Screen Bezel -->
    <rect x="8" y="8" width="174" height="324" rx="26" fill="url(#phoneScreen)"/>
    
    <!-- Camera Island / Dynamic Notch -->
    <rect x="65" y="18" width="60" height="14" rx="7" fill="#000" opacity="0.8"/>
    <circle cx="108" cy="25" r="3" fill="#1e293b"/>

    <!-- Screen UI: Sound detection pulse -->
    <circle cx="95" cy="170" r="50" fill="#0284c7" opacity="0.15"/>
    <circle cx="95" cy="170" r="35" fill="#38bdf8" opacity="0.25"/>
    <circle cx="95" cy="170" r="22" fill="#0ea5e9"/>
    
    <!-- Microphone / Sound Icon on phone screen -->
    <path d="M95 158 A 6 6 0 0 0 89 164 L 89 172 A 6 6 0 0 0 101 172 L 101 164 A 6 6 0 0 0 95 158 Z" fill="#ffffff"/>
    <path d="M85 168 A 10 10 0 0 0 105 168" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <line x1="95" y1="178" x2="95" y2="184" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="90" y1="184" x2="100" y2="184" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <text x="95" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e0f2fe" text-anchor="middle">Listening...</text>
    <text x="95" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Clap or Whistle to Find</text>
  </g>

  <!-- Emitted Sound Waves from Phone -->
  <g transform="translate(450, 150)" filter="url(#glow)">
    <!-- Wave 1 -->
    <path d="M 0,30 A 70,70 0 0,1 0,130" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
    <!-- Wave 2 -->
    <path d="M 30,10 A 110,110 0 0,1 30,150" fill="none" stroke="#38bdf8" stroke-width="5.5" stroke-linecap="round" opacity="0.8"/>
    <!-- Wave 3 -->
    <path d="M 65,-10 A 150,150 0 0,1 65,170" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <!-- Wave 4 -->
    <path d="M 100,-30 A 190,190 0 0,1 100,190" fill="none" stroke="#38bdf8" stroke-width="6.5" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Ambient Light Reflection on desk -->
  <ellipse cx="490" cy="240" rx="140" ry="70" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
</svg>
