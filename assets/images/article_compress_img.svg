<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#compBg)"/>
  
  <!-- Subtle background grid lines -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.15">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Left Card: Original Heavy File 8.4 MB -->
  <g transform="translate(130, 80)" filter="url(#cardShadow)">
    <rect width="240" height="290" rx="18" fill="#ffffff"/>
    <rect x="20" y="20" width="200" height="150" rx="12" fill="#e2e8f0"/>
    <!-- Photo icon -->
    <circle cx="70" cy="70" r="14" fill="#94a3b8"/>
    <polygon points="40,150 100,90 140,130 170,105 200,150" fill="#64748b"/>
    <!-- File tag -->
    <rect x="20" y="190" width="80" height="24" rx="6" fill="#fee2e2"/>
    <text x="60" y="206" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">8.4 MB</text>
    <text x="20" y="235" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e293b">IMG_2025.JPG</text>
    <text x="20" y="255" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">Original High Res (4000x3000)</text>
  </g>

  <!-- Arrow in Middle -->
  <g transform="translate(390, 205)">
    <circle cx="20" cy="20" r="28" fill="#ffffff" filter="url(#cardShadow)"/>
    <path d="M 12 20 H 28 M 22 14 L 28 20 L 22 26" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Card: Compressed Crisp File 420 KB -->
  <g transform="translate(450, 80)" filter="url(#cardShadow)">
    <rect width="240" height="290" rx="18" fill="#ffffff"/>
    <rect x="20" y="20" width="200" height="150" rx="12" fill="#bae6fd"/>
    <!-- Photo icon crisp -->
    <circle cx="70" cy="70" r="14" fill="#0284c7"/>
    <polygon points="40,150 100,90 140,130 170,105 200,150" fill="#0369a1"/>
    <!-- Quality match badge -->
    <rect x="20" y="190" width="90" height="24" rx="6" fill="#dcfce7"/>
    <text x="65" y="206" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">420 KB (-95%)</text>
    <text x="20" y="235" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e293b">IMG_2025_opt.JPG</text>
    <text x="20" y="255" font-family="-apple-system, sans-serif" font-size="12" fill="#16a34a">Same Clarity &amp; Dimensions</text>
  </g>
</svg>
